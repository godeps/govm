name: build-native

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  GO_VERSION: '1.24.x'
  RUST_TOOLCHAIN: stable
  SKIP_INSTALL_NODEJS: '1'

jobs:
  build-darwin-arm64:
    name: Build (darwin_arm64)
    runs-on: macos-15

    steps:
      - name: Checkout govm
        uses: actions/checkout@v4

      - name: Resolve boxlite ref from Cargo.lock
        id: boxlite-ref
        run: |
          ref=$(grep -oE 'git\+https://github.com/boxlite-ai/boxlite#[0-9a-f]{40}' rust-bridge/Cargo.lock | head -1 | cut -d'#' -f2)
          if [[ -z "$ref" ]]; then
            echo "failed to resolve boxlite git ref from rust-bridge/Cargo.lock" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout boxlite
        uses: actions/checkout@v4
        with:
          repository: boxlite-ai/boxlite
          path: boxlite-src
          ref: ${{ steps.boxlite-ref.outputs.ref }}
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Build boxlite runtime from source
        working-directory: boxlite-src
        run: |
          make setup:build runtime
          runtime_dir=$(find "$PWD/target" -path '*/out/runtime' -type d | sort | tail -1)
          if [[ -z "$runtime_dir" ]]; then
            echo "runtime dir not found under boxlite target/" >&2
            exit 1
          fi
          echo "BOXLITE_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"

      - name: Build govm bridge against local boxlite checkout
        run: |
          BOXLITE_REPO_DIR="$GITHUB_WORKSPACE/boxlite-src" \
          TARGET_PLATFORM="darwin_arm64" \
          ./scripts/build-bridge.sh release

      - name: Stage repo assets
        run: |
          stage_dir="$RUNNER_TEMP/staged"
          ./scripts/stage-platform-assets.sh \
            "darwin_arm64" \
            "rust-bridge/target/release/libgovm_boxlite_bridge.a" \
            "$BOXLITE_RUNTIME_DIR" \
            "$stage_dir"
          echo "STAGE_DIR=$stage_dir" >> "$GITHUB_ENV"

      - name: Upload staged assets
        uses: actions/upload-artifact@v4
        with:
          name: platform-assets-darwin_arm64
          path: ${{ env.STAGE_DIR }}/internal
          if-no-files-found: error
          retention-days: 7

  build-linux-arm64:
    name: Build (linux_arm64)
    needs: build-darwin-arm64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout govm
        uses: actions/checkout@v4

      - name: Resolve boxlite ref from Cargo.lock
        id: boxlite-ref
        run: |
          ref=$(grep -oE 'git\+https://github.com/boxlite-ai/boxlite#[0-9a-f]{40}' rust-bridge/Cargo.lock | head -1 | cut -d'#' -f2)
          if [[ -z "$ref" ]]; then
            echo "failed to resolve boxlite git ref from rust-bridge/Cargo.lock" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout boxlite
        uses: actions/checkout@v4
        with:
          repository: boxlite-ai/boxlite
          path: boxlite-src
          ref: ${{ steps.boxlite-ref.outputs.ref }}
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Build boxlite runtime from source
        working-directory: boxlite-src
        run: |
          make setup:build runtime
          runtime_dir=$(find "$PWD/target" -path '*/out/runtime' -type d | sort | tail -1)
          if [[ -z "$runtime_dir" ]]; then
            echo "runtime dir not found under boxlite target/" >&2
            exit 1
          fi
          echo "BOXLITE_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"

      - name: Build govm bridge against local boxlite checkout
        run: |
          BOXLITE_REPO_DIR="$GITHUB_WORKSPACE/boxlite-src" \
          TARGET_PLATFORM="linux_arm64" \
          ./scripts/build-bridge.sh release

      - name: Stage repo assets
        run: |
          stage_dir="$RUNNER_TEMP/staged"
          ./scripts/stage-platform-assets.sh \
            "linux_arm64" \
            "rust-bridge/target/release/libgovm_boxlite_bridge.a" \
            "$BOXLITE_RUNTIME_DIR" \
            "$stage_dir"
          echo "STAGE_DIR=$stage_dir" >> "$GITHUB_ENV"

      - name: Upload staged assets
        uses: actions/upload-artifact@v4
        with:
          name: platform-assets-linux_arm64
          path: ${{ env.STAGE_DIR }}/internal
          if-no-files-found: error
          retention-days: 7

  build-linux-amd64:
    name: Build (linux_amd64)
    needs: build-linux-arm64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout govm
        uses: actions/checkout@v4

      - name: Resolve boxlite ref from Cargo.lock
        id: boxlite-ref
        run: |
          ref=$(grep -oE 'git\+https://github.com/boxlite-ai/boxlite#[0-9a-f]{40}' rust-bridge/Cargo.lock | head -1 | cut -d'#' -f2)
          if [[ -z "$ref" ]]; then
            echo "failed to resolve boxlite git ref from rust-bridge/Cargo.lock" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout boxlite
        uses: actions/checkout@v4
        with:
          repository: boxlite-ai/boxlite
          path: boxlite-src
          ref: ${{ steps.boxlite-ref.outputs.ref }}
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Build boxlite runtime from source
        working-directory: boxlite-src
        run: |
          make setup:build runtime
          runtime_dir=$(find "$PWD/target" -path '*/out/runtime' -type d | sort | tail -1)
          if [[ -z "$runtime_dir" ]]; then
            echo "runtime dir not found under boxlite target/" >&2
            exit 1
          fi
          echo "BOXLITE_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"

      - name: Build govm bridge against local boxlite checkout
        run: |
          BOXLITE_REPO_DIR="$GITHUB_WORKSPACE/boxlite-src" \
          TARGET_PLATFORM="linux_amd64" \
          ./scripts/build-bridge.sh release

      - name: Stage repo assets
        run: |
          stage_dir="$RUNNER_TEMP/staged"
          ./scripts/stage-platform-assets.sh \
            "linux_amd64" \
            "rust-bridge/target/release/libgovm_boxlite_bridge.a" \
            "$BOXLITE_RUNTIME_DIR" \
            "$stage_dir"
          echo "STAGE_DIR=$stage_dir" >> "$GITHUB_ENV"

      - name: Upload staged assets
        uses: actions/upload-artifact@v4
        with:
          name: platform-assets-linux_amd64
          path: ${{ env.STAGE_DIR }}/internal
          if-no-files-found: error
          retention-days: 7

  commit-assets:
    name: Commit assets
    needs:
      - build-darwin-arm64
      - build-linux-arm64
      - build-linux-amd64
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    permissions:
      contents: write

    steps:
      - name: Checkout govm
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download staged assets
        uses: actions/download-artifact@v4
        with:
          path: .
          pattern: platform-assets-*
          merge-multiple: true

      - name: Validate staged assets
        run: STRICT=1 make platform-check

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- internal/native internal/runtimeassets/runtime; then
            echo "No asset changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/native internal/runtimeassets/runtime
          git commit -m "chore: refresh native assets [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
